name: Build, Test and Publish PT-LIMS Lambda Images

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      delete_attachments_release_type:
        description: DeleteAttachments release increment; choose none when it is not being released
        required: true
        default: none
        type: choice
        options: [none, patch, minor, major]
      delete_consultant_release_type:
        description: DeleteConsultant release increment; choose none when it is not being released
        required: true
        default: none
        type: choice
        options: [none, patch, minor, major]
      remove_customer_data_release_type:
        description: RemoveCustomerData release increment; choose none when it is not being released
        required: true
        default: none
        type: choice
        options: [none, patch, minor, major]

permissions: {}

# Pull-request release-label contract:
# - DeleteAttachments: release:delete-attachments:patch, release:delete-attachments:minor or release:delete-attachments:major
# - DeleteConsultant: release:delete-consultant:patch, release:delete-consultant:minor or release:delete-consultant:major
# - RemoveCustomerData: release:remove-customer-data:patch, release:remove-customer-data:minor or release:remove-customer-data:major
# A changed component requires exactly one matching label. An unchanged
# component must not have a release label.

# Dynamic semantic-version rules are maintained independently per component:
# - No existing tag + patch = 0.0.1
# - No existing tag + minor = 0.1.0
# - delete-attachments-v0.1.0 + patch = delete-attachments-v0.1.1
# - delete-attachments-v0.1.0 + minor = delete-attachments-v0.2.0
# - delete-consultant and remove-customer-data follow the same independent sequence.

# Production releases are serialized so two merges cannot calculate the same
# next semantic version. Pull-request checks run independently; they are not
# cancelled by a newer run in the current queue configuration.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ptl-lambda-pr-{0}-{1}', github.event.pull_request.number, github.run_id) || 'ptl-lambda-production-release' }}
  queue: max

env:
  DOTNET_VERSION: "10.0.x"

jobs:
  changes:
    name: Detect affected lambdas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # pull-requests:read is needed here (not at workflow level) for dorny/paths-filter
    # to read the PR diff via the GitHub API.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      components: ${{ steps.components.outputs.result }}
      dockerfiles: ${{ steps.dockerfiles.outputs.map }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changed paths
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            delete-attachments:
              - 'src/PTL.Lambda.DeleteAttachments/**'
              - 'src/PTL.Lambda.Shared/**'
              - 'tests/PTL.Lambda.DeleteAttachments.Tests/**'
              - 'tests/PTL.Lambda.Shared.Tests/**'
              - 'tests/PTL.Lambda.TestKit/**'
              - 'PTL.Lambda.slnx'
              - 'Directory.Build.*'
              - 'SonarQube.Analysis.xml'
              - '.github/workflows/build-test-publish-images.yml'
            delete-consultant:
              - 'src/PTL.Lambda.DeleteConsultant/**'
              - 'src/PTL.Lambda.Shared/**'
              - 'tests/PTL.Lambda.DeleteConsultant.Tests/**'
              - 'tests/PTL.Lambda.Shared.Tests/**'
              - 'tests/PTL.Lambda.TestKit/**'
              - 'PTL.Lambda.slnx'
              - 'Directory.Build.*'
              - 'SonarQube.Analysis.xml'
              - '.github/workflows/build-test-publish-images.yml'
            remove-customer-data:
              - 'src/PTL.Lambda.RemoveCustomerData/**'
              - 'src/PTL.Lambda.Shared/**'
              - 'tests/PTL.Lambda.RemoveCustomerData.Tests/**'
              - 'tests/PTL.Lambda.Shared.Tests/**'
              - 'tests/PTL.Lambda.TestKit/**'
              - 'PTL.Lambda.slnx'
              - 'Directory.Build.*'
              - 'SonarQube.Analysis.xml'
              - '.github/workflows/build-test-publish-images.yml'

      - name: Resolve affected components
        id: components
        shell: bash
        env:
          DETECTED_COMPONENTS: ${{ steps.filter.outputs.changes }}
          MANUAL_DELETE_ATTACHMENTS_RELEASE_TYPE: ${{ inputs.delete_attachments_release_type }}
          MANUAL_DELETE_CONSULTANT_RELEASE_TYPE: ${{ inputs.delete_consultant_release_type }}
          MANUAL_REMOVE_CUSTOMER_DATA_RELEASE_TYPE: ${{ inputs.remove_customer_data_release_type }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ github.ref }}" != "refs/heads/main" ]]; then
              echo "::error::Production workflow dispatches must run from the main branch."
              exit 1
            fi
            COMPONENTS='[]'
            for PAIR in "delete-attachments:${MANUAL_DELETE_ATTACHMENTS_RELEASE_TYPE}" "delete-consultant:${MANUAL_DELETE_CONSULTANT_RELEASE_TYPE}" "remove-customer-data:${MANUAL_REMOVE_CUSTOMER_DATA_RELEASE_TYPE}"; do
              COMPONENT="${PAIR%%:*}"
              RELEASE_TYPE="${PAIR#*:}"
              if [[ "${RELEASE_TYPE}" != "none" ]]; then
                COMPONENTS="$(jq -c --arg component "${COMPONENT}" '. + [$component]' <<< "${COMPONENTS}")"
              fi
            done
            if [[ "${COMPONENTS}" == "[]" ]]; then
              echo "::error::Select a release increment for at least one component."
              exit 1
            fi
            echo "result=${COMPONENTS}" >> "${GITHUB_OUTPUT}"
          else
            echo "result=${DETECTED_COMPONENTS}" >> "${GITHUB_OUTPUT}"
          fi

      # Single source of truth for the component -> Dockerfile mapping, consumed
      # by container-validation and publish instead of each duplicating it.
      - name: Map components to their Dockerfiles
        id: dockerfiles
        shell: bash
        run: |
          echo 'map={"delete-attachments":"src/PTL.Lambda.DeleteAttachments/Dockerfile","delete-consultant":"src/PTL.Lambda.DeleteConsultant/Dockerfile","remove-customer-data":"src/PTL.Lambda.RemoveCustomerData/Dockerfile"}' >> "${GITHUB_OUTPUT}"

  release-label-validation:
    name: Validate component release labels
    needs: [changes]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      COMPONENTS_JSON: ${{ needs.changes.outputs.components }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Enforce component-specific release labels
        shell: bash
        run: |
          set -euo pipefail
          LABELS_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '[.labels[].name]')"
          jq -e 'type == "array"' <<< "${COMPONENTS_JSON}" >/dev/null
          jq -e 'type == "array"' <<< "${LABELS_JSON}" >/dev/null
          mapfile -t GENERIC_LABELS < <(
            jq -r '.[]' <<< "${LABELS_JSON}" |
              grep -E '^release:(patch|minor|major)$' || true
          )
          if (( ${#GENERIC_LABELS[@]} > 0 )); then
            echo "::error::Generic release labels are not allowed. Use release:delete-attachments:, release:delete-consultant: or release:remove-customer-data: labels."
            exit 1
          fi

          validate_component() {
            local component="$1"
            local changed="false"
            local labels=()
            if jq -e --arg component "${component}" 'index($component) != null' <<< "${COMPONENTS_JSON}" >/dev/null; then
              changed="true"
            fi
            mapfile -t labels < <(
              jq -r '.[]' <<< "${LABELS_JSON}" |
                grep -E "^release:${component}:(patch|minor|major)$" || true
            )
            if [[ "${changed}" == "true" && "${#labels[@]}" -ne 1 ]]; then
              echo "::error::Changed ${component} requires exactly one release:${component}:patch, release:${component}:minor or release:${component}:major label."
              return 1
            fi
            if [[ "${changed}" == "false" && "${#labels[@]}" -ne 0 ]]; then
              echo "::error::${component} did not change, so remove its release label."
              return 1
            fi
          }
          validate_component delete-attachments
          validate_component delete-consultant
          validate_component remove-customer-data
          echo "Component release labels match the changed paths."

  release-version:
    name: Calculate component release versions
    needs: [changes]
    if: >-
      needs.changes.outputs.components != '[]' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      versions: ${{ steps.version.outputs.versions }}
      git_tags: ${{ steps.version.outputs.git_tags }}
      release_types: ${{ steps.version.outputs.release_types }}
      pull_request: ${{ steps.version.outputs.pull_request }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Calculate independent PT-LIMS Lambda component versions
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMPONENTS_JSON: ${{ needs.changes.outputs.components }}
          MANUAL_DELETE_ATTACHMENTS_RELEASE_TYPE: ${{ inputs.delete_attachments_release_type }}
          MANUAL_DELETE_CONSULTANT_RELEASE_TYPE: ${{ inputs.delete_consultant_release_type }}
          MANUAL_REMOVE_CUSTOMER_DATA_RELEASE_TYPE: ${{ inputs.remove_customer_data_release_type }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          PR_NUMBER=""
          LABELS_JSON='[]'
          if [[ "${{ github.event_name }}" != "workflow_dispatch" ]]; then
            PR_NUMBER="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
              --jq '[.[] | select(.merged_at != null and .base.ref == "main")] | sort_by(.merged_at) | last | .number // empty')"
            if [[ -z "${PR_NUMBER}" ]]; then
              echo "::error::Production publication must originate from a pull request merged into main."
              exit 1
            fi
            LABELS_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '[.labels[].name]')"
          fi

          mapfile -t GENERIC_LABELS < <(
            jq -r '.[]' <<< "${LABELS_JSON}" |
              grep -E '^release:(patch|minor|major)$' || true
          )
          if (( ${#GENERIC_LABELS[@]} > 0 )); then
            echo "::error::Generic release labels are not supported. Use component-specific labels."
            exit 1
          fi

          VERSIONS='{}'
          GIT_TAGS='{}'
          RELEASE_TYPES='{}'
          component_changed() {
            jq -e --arg component "$1" 'index($component) != null' <<< "${COMPONENTS_JSON}" >/dev/null
          }
          manual_release_type() {
            case "$1" in
              delete-attachments) printf '%s\n' "${MANUAL_DELETE_ATTACHMENTS_RELEASE_TYPE}" ;;
              delete-consultant) printf '%s\n' "${MANUAL_DELETE_CONSULTANT_RELEASE_TYPE}" ;;
              remove-customer-data) printf '%s\n' "${MANUAL_REMOVE_CUSTOMER_DATA_RELEASE_TYPE}" ;;
              *) return 1 ;;
            esac
          }
          resolve_release_type() {
            local component="$1"
            local changed="$2"
            local release_type=""
            local labels=()
            if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
              release_type="$(manual_release_type "${component}")"
              if [[ "${changed}" == "true" && ! "${release_type}" =~ ^(patch|minor|major)$ ]]; then
                echo "::error::A release increment is required for changed component ${component}." >&2
                return 1
              fi
              if [[ "${changed}" == "false" && "${release_type}" != "none" ]]; then
                echo "::error::Component ${component} is not selected but has release type ${release_type}." >&2
                return 1
              fi
            else
              mapfile -t labels < <(
                jq -r '.[]' <<< "${LABELS_JSON}" |
                  grep -E "^release:${component}:(patch|minor|major)$" || true
              )
              if [[ "${changed}" == "true" && "${#labels[@]}" -ne 1 ]]; then
                echo "::error::PR #${PR_NUMBER} must have exactly one release:${component}:* label because ${component} changed." >&2
                return 1
              fi
              if [[ "${changed}" == "false" && "${#labels[@]}" -ne 0 ]]; then
                echo "::error::PR #${PR_NUMBER} has a release label for unchanged component ${component}." >&2
                return 1
              fi
              if [[ "${changed}" == "true" ]]; then
                release_type="${labels[0]#release:${component}:}"
              else
                release_type="none"
              fi
            fi
            printf '%s\n' "${release_type}"
          }
          calculate_version() {
            local component="$1"
            local release_type="$2"
            local latest_tag current_version major minor patch
            latest_tag="$(git tag --list "${component}-v*" |
              grep -E "^${component}-v[0-9]+\.[0-9]+\.[0-9]+$" |
              sort -V | tail -1 || true)"
            if [[ -z "${latest_tag}" ]]; then
              latest_tag="${component}-v0.0.0"
            fi
            current_version="${latest_tag#${component}-v}"
            IFS='.' read -r major minor patch <<< "${current_version}"
            case "${release_type}" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
              *) echo "::error::Unsupported ${component} release type '${release_type}'." >&2; return 1 ;;
            esac
            printf '%s\n' "${major}.${minor}.${patch}"
          }

          for COMPONENT in delete-attachments delete-consultant remove-customer-data; do
            CHANGED="false"
            if component_changed "${COMPONENT}"; then CHANGED="true"; fi
            RELEASE_TYPE="$(resolve_release_type "${COMPONENT}" "${CHANGED}")"
            if [[ "${CHANGED}" == "false" ]]; then continue; fi
            mapfile -t EXISTING_COMMIT_TAGS < <(
              git tag --points-at "${GITHUB_SHA}" |
                grep -E "^${COMPONENT}-v[0-9]+\.[0-9]+\.[0-9]+$" || true
            )
            if (( ${#EXISTING_COMMIT_TAGS[@]} > 1 )); then
              echo "::error::Commit ${GITHUB_SHA} has multiple ${COMPONENT} release tags; refusing an ambiguous rerun."
              exit 1
            fi
            if (( ${#EXISTING_COMMIT_TAGS[@]} == 1 )); then
              NEXT_TAG="${EXISTING_COMMIT_TAGS[0]}"
              NEXT_VERSION="${NEXT_TAG#${COMPONENT}-v}"
              echo "Reusing ${NEXT_TAG} for an idempotent rerun."
            else
              NEXT_VERSION="$(calculate_version "${COMPONENT}" "${RELEASE_TYPE}")"
              NEXT_TAG="${COMPONENT}-v${NEXT_VERSION}"
              if git rev-parse --verify --quiet "refs/tags/${NEXT_TAG}" >/dev/null; then
                echo "::error::Calculated Git tag ${NEXT_TAG} already exists."
                exit 1
              fi
            fi
            VERSIONS="$(jq -c --arg component "${COMPONENT}" --arg value "${NEXT_VERSION}" \
              '. + {($component): $value}' <<< "${VERSIONS}")"
            GIT_TAGS="$(jq -c --arg component "${COMPONENT}" --arg value "${NEXT_TAG}" \
              '. + {($component): $value}' <<< "${GIT_TAGS}")"
            RELEASE_TYPES="$(jq -c --arg component "${COMPONENT}" --arg value "${RELEASE_TYPE}" \
              '. + {($component): $value}' <<< "${RELEASE_TYPES}")"
            echo "${COMPONENT}: ${NEXT_TAG} (${RELEASE_TYPE})"
          done
          {
            echo "versions=${VERSIONS}"
            echo "git_tags=${GIT_TAGS}"
            echo "release_types=${RELEASE_TYPES}"
            echo "pull_request=${PR_NUMBER}"
          } >> "${GITHUB_OUTPUT}"

  quality:
    name: Format, build and test solution
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore solution
        run: dotnet restore PTL.Lambda.slnx

      - name: Verify formatting
        run: dotnet format PTL.Lambda.slnx --verify-no-changes --no-restore

      - name: Build solution
        run: dotnet build PTL.Lambda.slnx --configuration Release --no-restore --warnaserror

      - name: Test solution
        run: >-
          dotnet test PTL.Lambda.slnx
          --configuration Release
          --no-build
          --no-restore
          --logger "trx;LogFilePrefix=ptl-lambda-tests"
          --results-directory "${{ runner.temp }}/test-results"

  sonarcloud:
    name: SonarCloud analysis
    if: vars.SONAR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Set up Java
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # dotnet-sonarscanner is intentionally not in the .config/dotnet-tools.json manifest -
      # installing it to a cached tool-path (Sonar's own recommended pattern) avoids pinning
      # to a specific NuGet version that can go stale/incompatible with the scanner engine.
      - name: Cache SonarCloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: Install SonarCloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${{ runner.temp }}/scanner"
          dotnet tool update dotnet-sonarscanner --tool-path "${{ runner.temp }}/scanner"

      - name: Restore solution
        run: dotnet restore PTL.Lambda.slnx

      - name: Analyse solution
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${SONAR_TOKEN}"
          "${{ runner.temp }}/scanner/dotnet-sonarscanner" begin \
            /k:"${{ vars.SONAR_PROJECT_KEY }}" \
            /o:"${{ vars.SONAR_ORGANIZATION }}" \
            /s:"${{ github.workspace }}/SonarQube.Analysis.xml" \
            /d:sonar.token="${SONAR_TOKEN}" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.qualitygate.wait=true
          dotnet build PTL.Lambda.slnx --configuration Release --no-restore
          dotnet test PTL.Lambda.slnx \
            --configuration Release \
            --no-restore \
            --logger "trx;LogFilePrefix=ptl-lambda-sonar-tests" \
            --results-directory "${{ runner.temp }}/test-results" \
            /p:Threshold=0
          "${{ runner.temp }}/scanner/dotnet-sonarscanner" end /d:sonar.token="${SONAR_TOKEN}"

  container-validation:
    name: Validate ${{ matrix.component }} container
    needs: [changes, quality]
    if: needs.changes.outputs.components != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.changes.outputs.components) }}
    env:
      DOCKERFILE: ${{ fromJSON(needs.changes.outputs.dockerfiles)[matrix.component] }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Validate resolved Dockerfile path
        if: env.DOCKERFILE == ''
        shell: bash
        run: |
          echo "::error::No Dockerfile mapped for component '${{ matrix.component }}'. Check the 'Map components to their Dockerfiles' step in the changes job."
          exit 1

      # ubuntu-latest ships Docker with BuildKit/buildx enabled by default, so
      # --mount=type=cache in the Dockerfiles works natively here - unlike the
      # windows-2022 runners used by the ECS apha-ptl-apps repo, no workaround
      # action is needed to strip cache mounts before building.
      - name: Build container without publishing
        shell: bash
        run: |
          docker build \
            --file "${{ env.DOCKERFILE }}" \
            --tag "ptl-lambda-${{ matrix.component }}:${GITHUB_SHA}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            .

      # On push to main this is the exact image publish later pushes - saving it here
      # means publish loads it instead of rebuilding, so what's pushed is guaranteed
      # to be byte-identical to what was just validated (and it's not rebuilt twice).
      - name: Save built image for reuse by publish
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: docker save "ptl-lambda-${{ matrix.component }}:${GITHUB_SHA}" -o "${{ runner.temp }}/ptl-lambda-${{ matrix.component }}.tar"

      - name: Upload built image artifact
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ptl-lambda-image-${{ matrix.component }}-${{ github.run_id }}
          path: ${{ runner.temp }}/ptl-lambda-${{ matrix.component }}.tar
          retention-days: 1
          overwrite: true

  publish:
    name: Publish ${{ matrix.component }} production image
    needs: [changes, quality, sonarcloud, container-validation, release-version]
    if: >-
      always() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      needs.changes.result == 'success' &&
      needs.quality.result == 'success' &&
      (vars.SONAR_ENABLED != 'true' || needs.sonarcloud.result == 'success') &&
      needs.container-validation.result == 'success' &&
      needs.release-version.result == 'success' &&
      needs.changes.outputs.components != '[]'
    runs-on: ubuntu-latest
    environment: ecr-production
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.changes.outputs.components) }}
    env:
      AWS_REGION: ${{ secrets.AWS_ENV_REGION }}
      AWS_ROLE_ARN: arn:aws:iam::${{ secrets.AWS_ENV_ACCOUNT }}:role/${{ secrets.AWS_ENV_OIDC_ROLE }}
      EXPECTED_AWS_ACCOUNT_ID: ${{ vars.EXPECTED_AWS_ACCOUNT_ID }}
      EXPECTED_AWS_REGION: ${{ vars.EXPECTED_AWS_REGION }}
      # One ECR repo per lambda (apha/ptl-delete-attachments, apha/ptl-delete-consultant,
      # apha/ptl-delete-customer-data) - resolved per component below.
      ECR_DELETE_ATTACHMENTS_REPOSITORY: ${{ vars.ECR_DELETE_ATTACHMENTS_REPOSITORY }}
      ECR_DELETE_CONSULTANT_REPOSITORY: ${{ vars.ECR_DELETE_CONSULTANT_REPOSITORY }}
      ECR_REMOVE_CUSTOMER_DATA_REPOSITORY: ${{ vars.ECR_REMOVE_CUSTOMER_DATA_REPOSITORY }}
      VERSIONS_JSON: ${{ needs.release-version.outputs.versions }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Resolve and validate publishing configuration
        id: component
        shell: bash
        run: |
          set -euo pipefail

          test -n "${EXPECTED_AWS_ACCOUNT_ID}" || {
            echo "::error::Repository variable EXPECTED_AWS_ACCOUNT_ID is not configured."
            exit 1
          }
          test -n "${EXPECTED_AWS_REGION}" || {
            echo "::error::Repository variable EXPECTED_AWS_REGION is not configured."
            exit 1
          }
          [[ "${EXPECTED_AWS_ACCOUNT_ID}" =~ ^[0-9]{12}$ ]] || {
            echo "::error::EXPECTED_AWS_ACCOUNT_ID must contain exactly 12 digits."
            exit 1
          }
          [[ "${AWS_REGION}" == "${EXPECTED_AWS_REGION}" ]] || {
            echo "::error::AWS_ENV_REGION does not match EXPECTED_AWS_REGION."
            exit 1
          }

          case "${{ matrix.component }}" in
            delete-attachments) ECR_REPOSITORY="${ECR_DELETE_ATTACHMENTS_REPOSITORY}" ;;
            delete-consultant) ECR_REPOSITORY="${ECR_DELETE_CONSULTANT_REPOSITORY}" ;;
            remove-customer-data) ECR_REPOSITORY="${ECR_REMOVE_CUSTOMER_DATA_REPOSITORY}" ;;
            *)
              echo "::error::Unsupported component: ${{ matrix.component }}"
              exit 1
              ;;
          esac

          test -n "${ECR_REPOSITORY}" || {
            echo "::error::No ECR repository is configured for ${{ matrix.component }}."
            exit 1
          }

          RELEASE_VERSION="$(jq -er --arg component "${{ matrix.component }}" '.[$component]' <<< "${VERSIONS_JSON}")"
          [[ "${RELEASE_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Invalid calculated release version '${RELEASE_VERSION}'."
            exit 1
          }

          EXPECTED_ROLE_PREFIX="arn:aws:iam::${EXPECTED_AWS_ACCOUNT_ID}:role/"
          [[ "${AWS_ROLE_ARN}" == "${EXPECTED_ROLE_PREFIX}"* && "${AWS_ROLE_ARN}" != "${EXPECTED_ROLE_PREFIX}" ]] || {
            echo "::error::Check AWS_ENV_ACCOUNT and AWS_ENV_OIDC_ROLE; the role ARN must reference the expected account and include a role name."
            exit 1
          }

          echo "ecr_repository=${ECR_REPOSITORY}" >> "${GITHUB_OUTPUT}"
          echo "release_version=${RELEASE_VERSION}" >> "${GITHUB_OUTPUT}"

      # Reuses the exact image container-validation already built and validated for
      # this commit, instead of building it again from scratch.
      - name: Download validated image artifact
        uses: actions/download-artifact@v4
        with:
          name: ptl-lambda-image-${{ matrix.component }}-${{ github.run_id }}
          path: ${{ runner.temp }}

      - name: Load validated image
        shell: bash
        run: docker load -i "${{ runner.temp }}/ptl-lambda-${{ matrix.component }}.tar"

      - name: Display OIDC claims for troubleshooting
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          RESPONSE="$(curl --silent --show-error --fail \
            --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")"

          TOKEN="$(echo "${RESPONSE}" | jq -er '.value')"
          PAYLOAD="$(echo "${TOKEN}" | cut -d '.' -f 2)"

          TOKEN_PAYLOAD="${PAYLOAD}" python3 - <<'PY'
          import base64
          import json
          import os

          payload = os.environ["TOKEN_PAYLOAD"]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))

          for key in [
              "aud",
              "sub",
              "repository",
              "repository_owner_id",
              "repository_id",
              "ref",
              "event_name",
              "environment",
          ]:
              print(f"{key}={claims.get(key)}")
          PY

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: ptl-lambda-${{ github.run_id }}-${{ matrix.component }}
          audience: sts.amazonaws.com

      - name: Verify assumed AWS account
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          [[ "${ACTUAL_ACCOUNT_ID}" == "${EXPECTED_AWS_ACCOUNT_ID}" ]] || {
            echo "::error::The assumed AWS account does not match EXPECTED_AWS_ACCOUNT_ID."
            exit 1
          }

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6
        with:
          mask-password: true

      - name: Publish immutable versioned image
        id: image
        shell: bash
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: ${{ steps.component.outputs.ecr_repository }}
          RELEASE_VERSION: ${{ steps.component.outputs.release_version }}
        run: |
          set -euo pipefail
          LOCAL_IMAGE="ptl-lambda-${{ matrix.component }}:${GITHUB_SHA}"
          CANDIDATE_TAG="sha-${GITHUB_SHA::12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          CANDIDATE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${CANDIDATE_TAG}"
          docker tag "${LOCAL_IMAGE}" "${CANDIDATE_URI}"
          docker push "${CANDIDATE_URI}"
          IMAGE_DIGEST="$(aws ecr describe-images \
            --registry-id "${EXPECTED_AWS_ACCOUNT_ID}" \
            --repository-name "${ECR_REPOSITORY}" \
            --image-ids imageTag="${CANDIDATE_TAG}" \
            --query 'imageDetails[0].imageDigest' --output text)"
          [[ "${IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::ECR returned an invalid candidate digest '${IMAGE_DIGEST}'."
            exit 1
          }
          DIGEST_HEX="${IMAGE_DIGEST#sha256:}"
          DIGEST_SUFFIX="${DIGEST_HEX: -8}"
          RELEASE_TAG="v${RELEASE_VERSION}-${DIGEST_SUFFIX}"
          RELEASE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${RELEASE_TAG}"
          EXISTING_DIGEST="$(aws ecr describe-images \
            --registry-id "${EXPECTED_AWS_ACCOUNT_ID}" \
            --repository-name "${ECR_REPOSITORY}" \
            --image-ids imageTag="${RELEASE_TAG}" \
            --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || true)"
          if [[ -n "${EXISTING_DIGEST}" && "${EXISTING_DIGEST}" != "None" ]]; then
            if [[ "${EXISTING_DIGEST}" != "${IMAGE_DIGEST}" ]]; then
              echo "::error::Immutable tag ${RELEASE_TAG} already points to another digest."
              exit 1
            fi
            echo "${RELEASE_TAG} already points to the validated digest."
          else
            # Push the same validated local image with the release tag. This avoids
            # manifest serialization changes introduced by an ECR put-image retag.
            docker tag "${LOCAL_IMAGE}" "${RELEASE_URI}"
            docker push "${RELEASE_URI}"
          fi
          RELEASE_DIGEST="$(aws ecr describe-images \
            --registry-id "${EXPECTED_AWS_ACCOUNT_ID}" \
            --repository-name "${ECR_REPOSITORY}" \
            --image-ids imageTag="${RELEASE_TAG}" \
            --query 'imageDetails[0].imageDigest' --output text)"
          if [[ "${RELEASE_DIGEST}" != "${IMAGE_DIGEST}" ]]; then
            echo "::error::Release tag digest does not match the validated candidate digest."
            exit 1
          fi
          {
            echo "image_tag=${RELEASE_TAG}"
            echo "image_uri=${RELEASE_URI}"
            echo "image_digest=${IMAGE_DIGEST}"
            echo "candidate_tag=${CANDIDATE_TAG}"
            echo "digest_suffix=${DIGEST_SUFFIX}"
          } >> "${GITHUB_OUTPUT}"

      - name: Write publishing summary
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.image.outputs.image_tag }}
          IMAGE_URI: ${{ steps.image.outputs.image_uri }}
          IMAGE_DIGEST: ${{ steps.image.outputs.image_digest }}
          CANDIDATE_TAG: ${{ steps.image.outputs.candidate_tag }}
          RELEASE_VERSION: ${{ steps.component.outputs.release_version }}
        run: |
          {
            echo "### PT-LIMS ${{ matrix.component }} Lambda production image"
            echo
            echo "- Release version: v${RELEASE_VERSION}"
            echo "- ECR release tag: ${IMAGE_TAG}"
            echo "- Image URI: ${IMAGE_URI}"
            echo "- Immutable digest: ${IMAGE_DIGEST}"
            echo "- Candidate tag: ${CANDIDATE_TAG}"
            echo "- Commit: ${GITHUB_SHA}"
          } >> "${GITHUB_STEP_SUMMARY}"

  finalise-release:
    name: Create immutable component Git tags
    needs: [changes, release-version, publish]
    if: >-
      always() &&
      needs.publish.result == 'success' &&
      needs.release-version.result == 'success' &&
      needs.changes.outputs.components != '[]' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Create annotated component release tags
        id: tags
        shell: bash
        env:
          COMPONENTS_JSON: ${{ needs.changes.outputs.components }}
          GIT_TAGS_JSON: ${{ needs.release-version.outputs.git_tags }}
          RELEASE_TYPES_JSON: ${{ needs.release-version.outputs.release_types }}
          PR_NUMBER: ${{ needs.release-version.outputs.pull_request }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          TAG_REFS_TO_PUSH=()
          CREATED_TAGS='[]'
          while IFS= read -r COMPONENT; do
            RELEASE_TAG="$(jq -er --arg component "${COMPONENT}" '.[$component]' <<< "${GIT_TAGS_JSON}")"
            RELEASE_TYPE="$(jq -er --arg component "${COMPONENT}" '.[$component]' <<< "${RELEASE_TYPES_JSON}")"
            EXISTING_COMMIT="$(git rev-list -n 1 "${RELEASE_TAG}" 2>/dev/null || true)"
            if [[ -n "${EXISTING_COMMIT}" ]]; then
              if [[ "${EXISTING_COMMIT}" != "${GITHUB_SHA}" ]]; then
                echo "::error::${RELEASE_TAG} already points to ${EXISTING_COMMIT}."
                exit 1
              fi
              echo "${RELEASE_TAG} already points to this release commit."
            else
              MESSAGE="PT-LIMS Lambda ${COMPONENT} production release ${RELEASE_TAG}; increment=${RELEASE_TYPE}"
              if [[ -n "${PR_NUMBER}" ]]; then MESSAGE="${MESSAGE}; PR #${PR_NUMBER}"; fi
              git tag -a "${RELEASE_TAG}" "${GITHUB_SHA}" -m "${MESSAGE}"
              TAG_REFS_TO_PUSH+=("refs/tags/${RELEASE_TAG}")
            fi
            CREATED_TAGS="$(jq -c --arg tag "${RELEASE_TAG}" '. + [$tag]' <<< "${CREATED_TAGS}")"
          done < <(jq -r '.[]' <<< "${COMPONENTS_JSON}")
          if (( ${#TAG_REFS_TO_PUSH[@]} > 0 )); then
            git push --atomic origin "${TAG_REFS_TO_PUSH[@]}"
          fi
          echo "created_tags=${CREATED_TAGS}" >> "${GITHUB_OUTPUT}"
      - name: Write release summary
        shell: bash
        env:
          COMPONENTS_JSON: ${{ needs.changes.outputs.components }}
          GIT_TAGS_JSON: ${{ needs.release-version.outputs.git_tags }}
          RELEASE_TYPES_JSON: ${{ needs.release-version.outputs.release_types }}
        run: |
          {
            echo "### PT-LIMS Lambda production releases finalised"
            echo
            echo "| Component | Git tag | Increment |"
            echo "|---|---|---|"
            while IFS= read -r COMPONENT; do
              RELEASE_TAG="$(jq -er --arg component "${COMPONENT}" '.[$component]' <<< "${GIT_TAGS_JSON}")"
              RELEASE_TYPE="$(jq -er --arg component "${COMPONENT}" '.[$component]' <<< "${RELEASE_TYPES_JSON}")"
              echo "| ${COMPONENT} | ${RELEASE_TAG} | ${RELEASE_TYPE} |"
            done < <(jq -r '.[]' <<< "${COMPONENTS_JSON}")
            echo
            echo "- Commit: ${GITHUB_SHA}"
          } >> "${GITHUB_STEP_SUMMARY}"

  gate:
    name: CI and publication gate
    needs: [changes, quality, sonarcloud, container-validation, release-version, publish, finalise-release]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      QUALITY_RESULT: ${{ needs.quality.result }}
      SONAR_RESULT: ${{ needs.sonarcloud.result }}
      CONTAINER_RESULT: ${{ needs.container-validation.result }}
      RELEASE_VERSION_RESULT: ${{ needs.release-version.result }}
      PUBLISH_RESULT: ${{ needs.publish.result }}
      FINALISE_RESULT: ${{ needs.finalise-release.result }}
      COMPONENTS: ${{ needs.changes.outputs.components }}
      SONAR_ENABLED: ${{ vars.SONAR_ENABLED }}
      EVENT_NAME: ${{ github.event_name }}
    steps:
      - name: Enforce required results
        shell: bash
        run: |
          set -euo pipefail

          [[ "${CHANGES_RESULT}" == "success" ]] || {
            echo "::error::Change detection result: ${CHANGES_RESULT}"
            exit 1
          }

          [[ "${QUALITY_RESULT}" == "success" ]] || {
            echo "::error::Quality result: ${QUALITY_RESULT}"
            exit 1
          }

          if [[ "${SONAR_ENABLED}" == "true" && "${SONAR_RESULT}" != "success" ]]; then
            echo "::error::SonarCloud is enabled but result is ${SONAR_RESULT}."
            exit 1
          fi

          if [[ "${COMPONENTS}" != "[]" && "${CONTAINER_RESULT}" != "success" ]]; then
            echo "::error::Container validation result: ${CONTAINER_RESULT}"
            exit 1
          fi

          if [[ "${EVENT_NAME}" =~ ^(push|workflow_dispatch)$ && "${COMPONENTS}" != "[]" ]]; then
            if [[ "${RELEASE_VERSION_RESULT}" != "success" ]]; then
              echo "::error::Release version calculation result: ${RELEASE_VERSION_RESULT}"
              exit 1
            fi
            if [[ "${PUBLISH_RESULT}" != "success" ]]; then
              echo "::error::Image publishing result: ${PUBLISH_RESULT}"
              exit 1
            fi
            if [[ "${FINALISE_RESULT}" != "success" ]]; then
              echo "::error::Release tag finalisation result: ${FINALISE_RESULT}"
              exit 1
            fi
          fi

          echo "All required CI checks passed."
